# XcodeGen spec. The generated ForecastActivities.xcodeproj is committed for convenience;
# regenerate it after editing this file with:  xcodegen generate   (brew install xcodegen)
name: ForecastActivities

options:
  bundleIdPrefix: com.sanjaykumar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  ActivityKit:
    path: Packages/ActivityKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  ForecastActivities:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ActivityKit
        products:
          - ActivityDomain
          - ActivityData
          - ActivityPresentation
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Forecast Activities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

schemes:
  ForecastActivities:
    build:
      targets:
        ForecastActivities: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ActivityKit/ActivityDomainTests
        - ActivityKit/ActivityDataTests
        - ActivityKit/ActivityPresentationTests
