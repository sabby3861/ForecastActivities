name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    name: ActivityKit unit tests (macOS, swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Run tests
        working-directory: Packages/ActivityKit
        run: swift test --parallel

  app-build:
    name: App builds for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Build
        run: |
          xcodebuild build \
            -project ForecastActivities.xcodeproj \
            -scheme ForecastActivities \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
