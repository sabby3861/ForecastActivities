name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uses the runner's default Xcode. Pinning an older one breaks when the image
# no longer ships the matching simulator runtime.
jobs:
  package-tests:
    name: ActivityKit unit tests (macOS, swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: Packages/ActivityKit
        run: swift test --parallel

  app-tests:
    name: App builds and tests on iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test-xcode
